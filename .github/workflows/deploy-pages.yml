# Legacy GitHub Pages publishing is manual only. Production remains on Vercel.
# The exact build that passes every check is the one published when explicitly dispatched.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:security
      - run: npm run test:app

      - run: npm run build
        env:
          # Project site lives at https://phongbao-uopeopleuni.github.io/ncpho/ — assets must use this base.
          VITE_BASE_PATH: /ncpho/

      - name: Browser test of the exact build that will be deployed (served like GitHub Pages)
        run: npm run test:security:browser -- --base=/ncpho/
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No npm install runs in this job, so no install script can reach the write token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
