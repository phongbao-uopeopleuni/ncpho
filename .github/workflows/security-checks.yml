name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-security-headers:
    name: API Security Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Start API server
        run: npm run dev:server > server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat server.log || true
          exit 1

      - name: Verify security headers
        run: |
          headers=$(curl -sSI http://127.0.0.1:8787/api/health)
          echo "$headers"

          echo "$headers" | grep -iq "x-content-type-options: nosniff"
          echo "$headers" | grep -iq "x-frame-options: DENY"
          echo "$headers" | grep -iq "referrer-policy: strict-origin-when-cross-origin"
          echo "$headers" | grep -iq "permissions-policy: camera=(), microphone=(), geolocation=()"
          echo "$headers" | grep -iq "content-security-policy: default-src 'none'; frame-ancestors 'none'; base-uri 'none';"
