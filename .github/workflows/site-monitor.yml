# Checks the published site the way a visitor would get it (page + JS/CSS bundles), not just HTTP 200.
# Roll back through Vercel's deployment dashboard or revert the bad commit on main.
name: Live Site Monitor

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_run:
    workflows: ["Security Checks"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the published page and its bundles
        run: node scripts/check-live-site.mjs https://ncpho-ten.vercel.app/
